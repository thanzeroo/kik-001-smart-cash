<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Cash - Minimalist Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #121212;
      --surface-border: #262626;
      --text: #ededed;
      --text-muted: #a1a1aa;
      --accent: #ffffff;
      --accent-hover: #e5e5e5;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* AUTH OVERLAY / MODAL */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .auth-box {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
    }

    .auth-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--surface-border);
      margin-bottom: 1.25rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.5rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    input, select {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--surface-border);
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #000000;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--surface-border);
    }

    .btn-outline:hover {
      border-color: var(--text-muted);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      width: auto;
      margin-top: 0;
    }

    .btn-danger:hover {
      background: var(--danger);
      color: white;
    }

    /* DASHBOARD */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--surface-border);
      margin-bottom: 2rem;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .user-panel {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1.8fr;
      gap: 2rem;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .summary-box {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .summary-box .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .summary-box .value {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 0.25rem;
    }

    .tx-list {
      list-style: none;
    }

    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--surface-border);
    }

    .tx-item:last-child {
      border-bottom: none;
    }

    .tx-title {
      font-size: 0.875rem;
      font-weight: 500;
    }

    .tx-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .tx-val {
      font-size: 0.875rem;
      font-weight: 600;
      font-mono: monospace;
    }
  </style>
</head>
<body>

  <!-- AUTH MODAL -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-box">
      <div class="auth-title">Smart Cash</div>
      <div class="auth-subtitle">Sistem Pencatatan Keuangan Minimalis</div>

      <div class="tabs">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Masuk</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Daftar</button>
      </div>

      <!-- FORM LOGIN -->
      <form id="formLogin" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Masuk</button>
      </form>

      <!-- FORM REGISTER -->
      <form id="formRegister" onsubmit="handleRegister(event)" style="display: none;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="regUsername" placeholder="username" required>
        </div>
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="regName" placeholder="Nama Lengkap" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" class="btn">Daftar Akun</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD UTAMA -->
  <div class="container">
    <header>
      <div class="brand">Smart Cash</div>
      <div class="user-panel">
        <span id="userDisplayName">user</span>
        <button class="btn btn-outline" style="width: auto; padding: 0.35rem 0.75rem; font-size: 0.75rem;" onclick="logout()">Keluar</button>
      </div>
    </header>

    <div class="grid">
      <!-- Kiri: Tambah Transaksi -->
      <div>
        <div class="card">
          <div class="card-title">Tambah Transaksi</div>
          <form onsubmit="handleAddTx(event)">
            <div class="form-group">
              <label>Keterangan</label>
              <input type="text" id="txTitle" placeholder="Misal: Makan Siang" required>
            </div>
            <div class="form-group">
              <label>Nominal (Rp)</label>
              <input type="number" id="txAmount" placeholder="0" required min="1">
            </div>
            <div class="form-group">
              <label>Tipe</label>
              <select id="txType">
                <option value="income">Pemasukan (+)</option>
                <option value="expense">Pengeluaran (-)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Kategori</label>
              <input type="text" id="txCategory" placeholder="Makanan / Gaji" required>
            </div>
            <button type="submit" class="btn">Simpan</button>
          </form>
        </div>
      </div>

      <!-- Kanan: Summary & List -->
      <div>
        <!-- Summary Box -->
        <div class="summary-grid">
          <div class="summary-box">
            <div class="label">Pemasukan</div>
            <div class="value" id="valIncome">Rp 0</div>
          </div>
          <div class="summary-box">
            <div class="label">Pengeluaran</div>
            <div class="value" id="valExpense">Rp 0</div>
          </div>
          <div class="summary-box">
            <div class="label">Saldo</div>
            <div class="value" id="valBalance">Rp 0</div>
          </div>
        </div>

        <!-- Riwayat Transaksi -->
        <div class="card">
          <div class="card-title">Riwayat Transaksi</div>
          <ul class="tx-list" id="txList">
            <li style="text-align: center; color: var(--text-muted); padding: 1.5rem; font-size: 0.85rem;">Memuat data...</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('token') || '';

    window.addEventListener('DOMContentLoaded', () => {
      if (token) {
        verifySession();
      } else {
        showAuth(true);
      }
    });

    function showAuth(show) {
      document.getElementById('authOverlay').style.display = show ? 'flex' : 'none';
    }

    function switchTab(tab) {
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      document.getElementById('formLogin').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('formRegister').style.display = tab === 'register' ? 'block' : 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        token = data.access_token;
        localStorage.setItem('token', token);

        showAuth(false);
        updateUserDisplay(data.user);
        loadDashboard();
      } catch (err) {
        alert('Gagal Login: ' + err.message);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('regUsername').value;
      const full_name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, full_name, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        alert('Pendaftaran Berhasil! Silakan Login.');
        document.getElementById('loginEmail').value = email;
        document.getElementById('loginPassword').value = password;
        switchTab('login');
      } catch (err) {
        alert('Gagal Pendaftaran: ' + err.message);
      }
    }

    async function verifySession() {
      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        showAuth(false);
        updateUserDisplay(data.user);
        loadDashboard();
      } catch (err) {
        logout();
      }
    }

    function updateUserDisplay(user) {
      if (!user) return;
      const profile = user.profile || user.user_metadata || {};
      const name = profile.full_name || profile.username || user.email;
      document.getElementById('userDisplayName').innerText = name;
    }

    function logout() {
      token = '';
      localStorage.removeItem('token');
      showAuth(true);
    }

    async function loadDashboard() {
      if (!token) return;
      await Promise.all([loadSummary(), loadTransactions()]);
    }

    async function loadSummary() {
      try {
        const res = await fetch('/api/summary', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) return;

        const { total_income, total_expense, balance } = data.summary;
        document.getElementById('valIncome').innerText = 'Rp ' + total_income.toLocaleString('id-ID');
        document.getElementById('valExpense').innerText = 'Rp ' + total_expense.toLocaleString('id-ID');
        document.getElementById('valBalance').innerText = 'Rp ' + balance.toLocaleString('id-ID');
      } catch (err) {
        console.error(err);
      }
    }

    async function loadTransactions() {
      try {
        const res = await fetch('/api/transactions', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) return;

        const txList = document.getElementById('txList');
        txList.innerHTML = '';

        if (!data.transactions || data.transactions.length === 0) {
          txList.innerHTML = '<li style="text-align: center; color: var(--text-muted); padding: 1.5rem; font-size: 0.85rem;">Belum ada transaksi.</li>';
          return;
        }

        data.transactions.forEach(tx => {
          const li = document.createElement('li');
          li.className = 'tx-item';
          const isIncome = tx.type === 'income';
          const sign = isIncome ? '+' : '-';

          li.innerHTML = `
            <div>
              <div class="tx-title">${tx.title}</div>
              <div class="tx-meta">${tx.category || 'Lainnya'} • ${tx.date}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <span class="tx-val">${sign} Rp ${Number(tx.amount).toLocaleString('id-ID')}</span>
              <button class="btn btn-danger" onclick="deleteTx('${tx.id}')">Hapus</button>
            </div>
          `;
          txList.appendChild(li);
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function handleAddTx(e) {
      e.preventDefault();
      const title = document.getElementById('txTitle').value;
      const amount = document.getElementById('txAmount').value;
      const type = document.getElementById('txType').value;
      const category = document.getElementById('txCategory').value;

      try {
        const res = await fetch('/api/transactions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ title, amount, type, category })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        document.getElementById('txTitle').value = '';
        document.getElementById('txAmount').value = '';
        document.getElementById('txCategory').value = '';

        loadDashboard();
      } catch (err) {
        alert('Gagal menambah transaksi: ' + err.message);
      }
    }

    async function deleteTx(id) {
      if (!confirm('Hapus transaksi ini?')) return;
      try {
        const res = await fetch(`/api/transactions/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        loadDashboard();
      } catch (err) {
        alert('Gagal menghapus: ' + err.message);
      }
    }
  </script>
</body>
</html>
